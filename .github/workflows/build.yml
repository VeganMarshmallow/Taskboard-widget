name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Core unit tests
        id: test
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee test.log

      - name: Workflow script tests
        run: node --test .github/scripts/*.test.js

      - name: Annotate test failure
        if: failure() && steps.test.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh test.log "core tests"

      - name: Test summary
        if: always() && steps.test.outcome != 'skipped'
        run: .github/scripts/test-summary.sh core/build/test-results/test

      - name: Assemble release APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --console=plain 2>&1 | tee assemble.log

      - name: Annotate assemble failure
        if: failure() && steps.assemble.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh assemble.log "assembleRelease"

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease -PversionCode=${{ github.run_number }} --console=plain 2>&1 | tee lint.log

      - name: Annotate lint failure
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          if [ -f app/build/reports/lint-results-release.txt ]; then cat app/build/reports/lint-results-release.txt >> lint.log; fi
          .github/scripts/annotate-failure.sh lint.log "lint"

      - name: Surface lint warnings
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          report=app/build/reports/lint-results-release.txt
          [ -f "$report" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$report" | head -n 30 | while IFS= read -r line; do
            echo "::warning title=Lint::${line}"
          done
          echo "::notice title=Lint summary::$(tail -n 1 "$report")"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            *.log
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          cp "$apk" taskboard-widget.apk
          # Read by the app's in-app updater (core/update/VersionJsonParser.kt). versionName matches app/build.gradle.kts.
          printf '{"versionCode":%s,"versionName":"0.1.%s","sha":"%s","apkSha256":"%s","apkSize":%s}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" \
            "$(sha256sum taskboard-widget.apk | cut -d' ' -f1)" "$(stat -c %s taskboard-widget.apk)" > version.json
          notes="Built from ${GITHUB_SHA::7} on ${BRANCH} (build ${GITHUB_RUN_NUMBER}, versionCode ${GITHUB_RUN_NUMBER})."
          tag="$(.github/scripts/release-tag.sh "$BRANCH")"
          if [ "$tag" = "latest" ]; then
            title="Taskboard widget (latest)"; pre=""
          else
            title="Preview: ${BRANCH}"; pre="--prerelease"
          fi
          # Recreate so the release always points at this commit and holds only the newest APK.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" taskboard-widget.apk version.json --target "$GITHUB_SHA" --title "$title" --notes "$notes" $pre
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "::notice title=Release published::$url"
          echo "### 📦 APK published: [$tag]($url)" >> "$GITHUB_STEP_SUMMARY"

  # Instrumented tests on an emulator, plus the PR screenshots (uploaded next to the APK).
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Hardware acceleration for the emulator (from the android-emulator-runner README).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests and screenshots
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/emulator-tests.sh

      - name: Annotate instrumented test failure
        if: failure() && steps.emulator.outcome == 'failure'
        run: |
          [ -f instrument.log ] && cat instrument.log >> connected.log
          .github/scripts/annotate-failure.sh connected.log "instrumented tests"

      - name: Instrumented test summary
        if: always() && steps.emulator.outcome != 'skipped'
        run: .github/scripts/test-summary.sh app/build/outputs/androidTest-results/connected/debug "Instrumented tests"

      - name: Upload screenshots to release
        if: always() && steps.emulator.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(screenshots/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then echo "::warning title=Screenshots::none captured"; exit 0; fi
          tag="$(.github/scripts/release-tag.sh "$BRANCH")"
          gh release upload "$tag" "${pngs[@]}" --clobber
          echo "::notice title=Screenshots uploaded::${#pngs[@]} PNGs to $tag"

  # #40: the real-host tab tests on Android 12+ (API 35), where the list's rows travel inside the
  # widget update instead of through a RemoteViewsService; API 30 above only covers the old path.
  # (API 36 never finished booting on these runners.) Only the tab tests run, to keep it short.
  # It costs ~10 emulator minutes, so the "scope" step skips it (the job still passes) unless the
  # push is to main or the branch changes the widget code, these tests, their host or this file.
  emulator-recent:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scope (skip unless the widget list code changed)
        id: scope
        run: |
          widget='^app/src/main/kotlin/.*/widget/|^app/src/main/res/layout/(widget_board|row_item|row_note)\.xml$'
          tests='^app/src/androidTest/kotlin/.*/(TabFlashRealHostTest|TabTapRealHostTest|InlineListTest|RealWidgetHost)\.kt$'
          if [ "$GITHUB_REF_NAME" = main ]; then run=true
          elif ! base="$(git merge-base origin/main HEAD 2>/dev/null)"; then run=true
          elif git diff --name-only "$base" HEAD > changed.txt && grep -qE "$widget|$tests|^\.github/workflows/build\.yml$" changed.txt; then run=true
          else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "::notice title=Recent-Android tab tests skipped::no widget list changes on this branch"

      - uses: actions/setup-java@v5
        if: steps.scope.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.scope.outputs.run == 'true'

      - name: Enable KVM
        if: steps.scope.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tab tests on a recent Android
        id: emulator
        if: steps.scope.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 1200
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=io.github.veganmarshmallow.taskboard.TabFlashRealHostTest,io.github.veganmarshmallow.taskboard.TabTapRealHostTest,io.github.veganmarshmallow.taskboard.InlineListTest > connected.log 2>&1; s=$?; cat connected.log; exit $s

      - name: Annotate instrumented test failure
        if: failure() && steps.emulator.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh connected.log "tab tests, recent Android"

      - name: Tab test summary
        if: always() && steps.emulator.outcome != 'skipped'
        run: .github/scripts/test-summary.sh app/build/outputs/androidTest-results/connected/debug "Tab tests, recent Android"
