name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Core unit tests
        id: test
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee test.log

      - name: Annotate test failure
        if: failure() && steps.test.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh test.log "core tests"

      - name: Test summary
        if: always() && steps.test.outcome != 'skipped'
        run: .github/scripts/test-summary.sh core/build/test-results/test

      - name: Assemble release APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --console=plain 2>&1 | tee assemble.log

      - name: Annotate assemble failure
        if: failure() && steps.assemble.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh assemble.log "assembleRelease"

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease -PversionCode=${{ github.run_number }} --console=plain 2>&1 | tee lint.log

      - name: Annotate lint failure
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          if [ -f app/build/reports/lint-results-release.txt ]; then cat app/build/reports/lint-results-release.txt >> lint.log; fi
          .github/scripts/annotate-failure.sh lint.log "lint"

      - name: Surface lint warnings
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          report=app/build/reports/lint-results-release.txt
          [ -f "$report" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$report" | head -n 30 | while IFS= read -r line; do
            echo "::warning title=Lint::${line}"
          done
          echo "::notice title=Lint summary::$(tail -n 1 "$report")"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            *.log
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          cp "$apk" taskboard-widget.apk
          notes="Built from ${GITHUB_SHA::7} on ${BRANCH} (build ${GITHUB_RUN_NUMBER}, versionCode ${GITHUB_RUN_NUMBER})."
          if [ "$BRANCH" = "main" ]; then
            tag="latest"; title="Taskboard widget (latest)"; pre=""
          else
            safe="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed -e 's/--*/-/g' -e 's/^-//' -e 's/-$//' | cut -c1-60)"
            tag="preview-${safe}"; title="Preview: ${BRANCH}"; pre="--prerelease"
          fi
          # Recreate so the release always points at this commit and holds only the newest APK.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" taskboard-widget.apk --target "$GITHUB_SHA" --title "$title" --notes "$notes" $pre
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "::notice title=Release published::$url"
          echo "### 📦 APK published: [$tag]($url)" >> "$GITHUB_STEP_SUMMARY"
