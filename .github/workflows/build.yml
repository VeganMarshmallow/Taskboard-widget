name: build

# #52: what runs when (GitHub Free has ~2,000 Actions minutes a month; the emulator jobs are most of it).
# - Every push to a branch: only `build` (core unit tests, release APK, lint; ~4 min). No release.
# - The full run (`build` + `emulator` + `emulator-recent`, ~20 min) only where it matters:
#   - pushes to main (publishes the `latest` release),
#   - pull_request opened / reopened / ready_for_review / synchronize on a PR that is not a draft
#     (a draft PR's pull_request run has no jobs; its push run already ran `build`),
#   - workflow_dispatch with full=true (the default).
#   Full runs off main publish the PR's preview release (APK + screenshots); quick runs publish nothing.
# - A quick run is named "… [partial]" (run-name below). The widget's Merge button reads that marker
#   (core/merge/WorkflowRuns.kt): a workflow with only partial runs on the PR head isn't a pass, so it
#   waits for the full pull_request run instead of being satisfied by the push run's `build`.
#   Keep the run-name condition in sync with FULL_CI below.
# - #64: when update-prs.yml updates a PR with GITHUB_TOKEN, GitHub holds this workflow's pull_request
#   run for approval (no jobs run; a job `if:` can't prevent it). update-prs dispatches this workflow
#   instead and deletes the held run; the Merge button also ignores a held run once a full run passed.
run-name: >-
  ${{ format('build: {0}{1}', github.head_ref || github.ref_name,
  (!((github.event_name == 'push' && github.ref == 'refs/heads/main')
  || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
  || (github.event_name == 'workflow_dispatch' && inputs.full))) && ' [partial]' || '') }}

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the emulator tests and publish the release / preview release
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Same condition as run-name above.
  FULL_CI: >-
    ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
    || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    || (github.event_name == 'workflow_dispatch' && inputs.full) }}
  # The branch and commit being built. A pull_request run checks out the PR head (not GitHub's merge
  # commit), so it tests the same code as the push run and its preview release can point at that commit.
  BRANCH: ${{ github.head_ref || github.ref_name }}
  # Release signing key (#27). Not in the repo; empty on forks, where nothing is published.
  SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# A new push cancels the older run of the same branch (or PR) and event. Push and pull_request runs
# of one commit are in different groups, so neither cancels the other. Runs on main are never
# cancelled (a group per run); the publish step skips a run that main has already moved past.
concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && format('build-main-{0}', github.run_id)
    || format('build-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    # A draft PR's pull_request run does nothing: the push run of the same commit already builds it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      full: ${{ env.FULL_CI }}
      published: ${{ steps.publish.outputs.published }}
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Core unit tests
        id: test
        run: |
          set -o pipefail
          ./gradlew :core:test --console=plain 2>&1 | tee test.log

      - name: Workflow script tests
        run: node --test .github/scripts/*.test.js

      - name: Annotate test failure
        if: failure() && steps.test.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh test.log "core tests"

      - name: Test summary
        if: always() && steps.test.outcome != 'skipped'
        run: .github/scripts/test-summary.sh core/build/test-results/test

      - name: Decode release signing key
        if: env.SIGNING_KEYSTORE_B64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --console=plain 2>&1 | tee assemble.log

      - name: Annotate assemble failure
        if: failure() && steps.assemble.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh assemble.log "assembleRelease"

      - name: Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew :app:lintRelease -PversionCode=${{ github.run_number }} --console=plain 2>&1 | tee lint.log

      - name: Annotate lint failure
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          if [ -f app/build/reports/lint-results-release.txt ]; then cat app/build/reports/lint-results-release.txt >> lint.log; fi
          .github/scripts/annotate-failure.sh lint.log "lint"

      - name: Surface lint warnings
        if: always() && steps.lint.outcome != 'skipped'
        run: |
          report=app/build/reports/lint-results-release.txt
          [ -f "$report" ] || exit 0
          grep -E ': (Warning|Error|Information): ' "$report" | head -n 30 | while IFS= read -r line; do
            echo "::warning title=Lint::${line}"
          done
          echo "::notice title=Lint summary::$(tail -n 1 "$report")"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            *.log
            core/build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish APK to release
        id: publish
        # A forked PR's token can't write releases (and its branch name could collide with ours).
        # Only APKs signed with the release key are published, so updates always install over the app.
        if: >-
          env.FULL_CI == 'true' && env.SIGNING_KEYSTORE_B64 != '' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(.github/scripts/release-tag.sh "$BRANCH")"
          if [ "$tag" = "latest" ] && [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$HEAD_SHA" ]; then
            echo "::notice title=Release skipped::main has moved past ${HEAD_SHA::7}; its newer run publishes latest"
            exit 0
          fi
          apk="app/build/outputs/apk/release/app-release.apk"
          cp "$apk" taskboard-widget.apk
          # Read by the app's in-app updater (core/update/VersionJsonParser.kt). versionName matches app/build.gradle.kts.
          printf '{"versionCode":%s,"versionName":"0.1.%s","sha":"%s","apkSha256":"%s","apkSize":%s}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$HEAD_SHA" \
            "$(sha256sum taskboard-widget.apk | cut -d' ' -f1)" "$(stat -c %s taskboard-widget.apk)" > version.json
          notes="Built from ${HEAD_SHA::7} on ${BRANCH} (build ${GITHUB_RUN_NUMBER}, versionCode ${GITHUB_RUN_NUMBER})."
          if [ "$tag" = "latest" ]; then
            title="Taskboard widget (latest)"; pre=""
          else
            title="Preview: ${BRANCH}"; pre="--prerelease"
          fi
          # Recreate so the release always points at this commit and holds only the newest APK.
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          git push origin ":refs/tags/$tag" 2>/dev/null || true
          gh release create "$tag" taskboard-widget.apk version.json --target "$HEAD_SHA" --title "$title" --notes "$notes" $pre
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "::notice title=Release published::$url"
          echo "### 📦 APK published: [$tag]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Instrumented tests on an emulator, plus the PR screenshots (uploaded next to the APK).
  # Full runs only (see the top of this file).
  # The AVD (with a booted snapshot) is cached per API level; .github/actions/avd-setup sets it up
  # (#54). Only main saves it: a cache saved on a branch is visible to that branch alone, and these
  # are GBs of the repo's 10 GB cache quota.
  emulator:
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      # v2 (#61): rebuilt once with a snapshot taken after the system settled.
      AVD_KEY: avd-30-google_apis-x86_64-pixel_5-v2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}

      # Java, Gradle, KVM, disk space and the cached AVD snapshot (created and saved on main only).
      - uses: ./.github/actions/avd-setup
        with:
          api-level: 30
          cache-key: ${{ env.AVD_KEY }}

      # #58: about one run in three, system_server dies right after the snapshot loads, so the
      # runner's own `adb shell input keyevent 82` fails (DeadSystemException, adb exit 1) before
      # the script starts. So the step runs once more, but only when no test result exists yet: a
      # real test failure is never retried. #80: the retry cold-boots (no snapshot load) after the
      # dead emulator is killed and adb restarted, since a second snapshot restore could die the same
      # way. `emulator_verdict` (emulator-lib.sh) makes each decision; at most one retry per job.
      - name: Instrumented tests and screenshots
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with: &emulator-tests
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          force-avd-creation: false
          disable-animations: true
          # cold_boot is empty on the first try and -no-snapshot-load on the retry.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ steps.retry.outputs.cold_boot }}
          script: .github/scripts/emulator-tests.sh

      - name: Retry only if no test ran
        id: retry
        if: steps.emulator.outcome == 'failure'
        run: |
          . .github/scripts/emulator-lib.sh
          if [ "$(emulator_verdict failure app/build/outputs/androidTest-results/connected/debug 1)" = retry ]; then
            echo "::warning title=Emulator retried::the emulator or adb failed before any instrumented test result existed; cold-booting and retrying once"
            stop_emulator 30
            restart_adb
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "cold_boot=-no-snapshot-load" >> "$GITHUB_OUTPUT"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instrumented tests and screenshots (retry)
        id: emulator_retry
        if: steps.retry.outputs.retry == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with: *emulator-tests

      # Fails the job unless the retry passed (continue-on-error above keeps both tries from doing so).
      - name: Instrumented test verdict
        if: steps.emulator.outcome == 'failure'
        env:
          RETRIED: ${{ steps.retry.outputs.retry }}
          RETRY_OUTCOME: ${{ steps.emulator_retry.outcome }}
        run: |
          . .github/scripts/emulator-lib.sh
          [ "$RETRIED" = true ] || exit 1
          if [ "$(emulator_verdict "$RETRY_OUTCOME" app/build/outputs/androidTest-results/connected/debug 2)" = pass ]; then
            echo "::warning title=Emulator retried::emulator failed to start; retried once and passed"
          else
            echo "::error title=Emulator retried::the retry failed too"
            exit 1
          fi

      - name: Annotate instrumented test failure
        if: failure() && steps.emulator.outcome == 'failure'
        run: |
          [ -f instrument.log ] && cat instrument.log >> connected.log
          .github/scripts/annotate-failure.sh connected.log "instrumented tests"

      - name: Instrumented test summary
        if: always() && steps.emulator.outcome != 'skipped'
        run: .github/scripts/test-summary.sh app/build/outputs/androidTest-results/connected/debug "Instrumented tests"

      - name: Upload screenshots to release
        if: always() && steps.emulator.outcome != 'skipped' && needs.build.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pngs=(screenshots/*.png)
          if [ ${#pngs[@]} -eq 0 ]; then echo "::warning title=Screenshots::none captured"; exit 0; fi
          tag="$(.github/scripts/release-tag.sh "$BRANCH")"
          gh release upload "$tag" "${pngs[@]}" --clobber
          echo "::notice title=Screenshots uploaded::${#pngs[@]} PNGs to $tag"

  # #40: the real-host tab tests on Android 12+ (API 35), where the list's rows travel inside the
  # widget update instead of through a RemoteViewsService; API 30 above only covers the old path.
  # (API 36 never finished booting on these runners.) Only the tab tests run, to keep it short.
  # It costs ~10 emulator minutes, so the "scope" step skips it (the job still passes) unless the
  # push is to main or the branch changes the widget code, these tests, their host, this file or
  # the avd-setup action.
  # Like `emulator`, full runs only, with the AVD snapshot cached from main.
  emulator-recent:
    needs: build
    if: needs.build.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      AVD_KEY: avd-35-google_apis-x86_64-pixel_5-4096M-v1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Scope (skip unless the widget list code changed)
        id: scope
        run: |
          widget='^app/src/main/kotlin/.*/widget/|^app/src/main/res/layout/(widget_board|row_item|row_note)\.xml$'
          tests='^app/src/androidTest/kotlin/.*/(TabFlashRealHostTest|TabTapRealHostTest|InlineListTest|RealWidgetHost)\.kt$'
          if [ "$GITHUB_REF_NAME" = main ]; then run=true
          elif ! base="$(git merge-base origin/main HEAD 2>/dev/null)"; then run=true
          elif git diff --name-only "$base" HEAD > changed.txt && grep -qE "$widget|$tests|^\.github/workflows/build\.yml$|^\.github/actions/avd-setup/" changed.txt; then run=true
          else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "::notice title=Recent-Android tab tests skipped::no widget list changes on this branch"

      - uses: ./.github/actions/avd-setup
        if: steps.scope.outputs.run == 'true'
        with:
          api-level: 35
          ram-size: 4096M
          emulator-boot-timeout: 1200
          cache-key: ${{ env.AVD_KEY }}

      - name: Tab tests on a recent Android
        id: emulator
        if: steps.scope.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 1200
          ram-size: 4096M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.class=io.github.veganmarshmallow.taskboard.TabFlashRealHostTest,io.github.veganmarshmallow.taskboard.TabTapRealHostTest,io.github.veganmarshmallow.taskboard.InlineListTest > connected.log 2>&1; s=$?; cat connected.log; exit $s

      - name: Annotate instrumented test failure
        if: failure() && steps.emulator.outcome == 'failure'
        run: .github/scripts/annotate-failure.sh connected.log "tab tests, recent Android"

      - name: Tab test summary
        if: always() && steps.emulator.outcome != 'skipped'
        run: .github/scripts/test-summary.sh app/build/outputs/androidTest-results/connected/debug "Tab tests, recent Android"
