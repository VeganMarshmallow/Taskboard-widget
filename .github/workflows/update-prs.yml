name: update-prs

# #45: after every merge to main, bring Claude's next PR up to date and re-run its CI, so the
# widget can highlight it and (#79, auto merge) merge it once green. #79: only the next PR in merge
# order is updated per run (.github/scripts/update-prs-select.js), not every open PR: one CI run per
# merge; that PR's own merge runs this again for the one after it. Logic and its tests:
# .github/scripts/update-prs*.js.
#
# #83, work pace: the owner's setting lives in the private board repo (.board/settings.json in
# claude-workspace), which this GITHUB_TOKEN can't read, and reading it would need a stored secret.
# So the widget writes it into each merge commit it makes instead: a `Work-Pace: fast` trailer means
# Faster, and every open PR is updated at once (mode `all`). No trailer (Save usage, or a merge made
# on github.com) keeps mode `next`.
#
# #64, one CI run per update: the update goes through GITHUB_TOKEN, so GitHub starts no workflow for
# it; the script dispatches build.yml on the branch instead. GitHub does still register the PR's
# `pull_request` run for the new head, but holds it for approval (actor github-actions[bot]):
# `action_required`, no jobs. That gate is run-level, so build.yml can't skip it with a job `if:`, and
# a normal run would need a PAT or App token (a stored secret). So the script deletes that empty held
# run (held-runs.js; only the bot's, only on the head it just made), and the widget's Merge check
# ignores a held run once the same workflow passed on that commit. Real pushes are untouched.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write # labels and comments on PRs go through the Issues API
  actions: write # dispatch build.yml, and delete the held duplicate pull_request run (#64)

concurrency:
  group: update-prs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Update the next PR (or all, with work pace Faster) and re-run its build
        uses: actions/github-script@v7
        with:
          script: |
            const { updatePrs } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/update-prs.js`);
            const { modeForCommit } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/update-prs-select.js`);
            const mode = modeForCommit(context.payload.head_commit && context.payload.head_commit.message);
            core.info(`update mode: ${mode}`);
            const results = await updatePrs({
              mode,
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              main: context.payload.repository.default_branch || 'main',
              log: core.info,
            });
            await core.summary
              .addHeading('Claude PRs after this merge', 3)
              .addTable([['PR', 'Result'], ...results.map((r) => [`#${r.number}`, r.error ? `error: ${r.error}` : r.action])])
              .write();
            if (results.some((r) => r.action === 'error')) core.setFailed('Some PRs could not be updated');
